name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "pkg/runner/k8s"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: ${{ matrix.module }}

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "pkg/runner/k8s"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}

  gvisor:
    name: Test (gVisor)
    runs-on: ubuntu-latest
    env:
      # A pinned gVisor release, checked against this digest before use.
      GVISOR_RELEASE: "20261012"
      GVISOR_SHA512: 9606445eed5aedfcf05310e7ccef61d994089914c6622fc82624c24d2b18db1b2210f40e40a7be27b8b7772859de7d95c501b4eba66423053c960bf671377c5e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install runsc as a Docker runtime
        run: |
          curl -fsSLo "$RUNNER_TEMP/gvisor.tar.bz2" "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  $RUNNER_TEMP/gvisor.tar.bz2" | sha512sum --check --strict
          tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C "$RUNNER_TEMP" runsc
          sudo install -m 0755 "$RUNNER_TEMP/runsc" /usr/local/bin/runsc
          # --oci-seccomp makes gVisor enforce the driver's seccomp profile
          # too; without it runsc ignores the profile.
          sudo runsc install -- --oci-seccomp
          sudo systemctl restart docker
          runsc --version
          docker info --format '{{json .Runtimes.runsc}}'
      - name: Conformance suite under runsc
        env:
          PLAYSCAPE_DOCKER_TEST_RUNTIME: runsc
          PLAYSCAPE_DOCKER_TEST_REQUIRED: "1"
        run: go test -race -count=1 -v ./pkg/isolate/docker/

  examples:
    name: Build saige example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/saige/go.mod
          cache-dependency-path: "**/go.sum"
      - run: go build ./...
        working-directory: examples/saige
